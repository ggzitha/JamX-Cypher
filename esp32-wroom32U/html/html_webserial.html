<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --danger: #f85149;
            --warning: #f0883e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
            overflow-x: hidden;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            height: auto;
            min-height: calc(100vh - 20px);
            padding: 15px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .header {
            text-align: center;
            flex-shrink: 0;
            padding: 10px 0;
        }
        
        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
        }
        
        .terminal-container {
            flex: 1;
            min-height: 300px;
            max-height: 50vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .terminal-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }
        
        .terminal {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            min-height: min-content;
        }
        
        .terminal-line {
            margin-bottom: 8px;
            min-height: 18px;
            word-wrap: break-word;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            width: 100%;
        }
        
        .input {
            flex: 1;
            min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        
        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        
        .btn {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            min-width: 80px;
            touch-action: manipulation;
        }
        
        .btn:hover,
        .btn:active {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
        }
        
        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            width: 100%;
            touch-action: manipulation;
            margin-top: 10px;
        }
        
        .back-btn:hover,
        .back-btn:active {
            background: var(--bg-secondary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        
        .prompt {
            color: #2ea043;
            font-weight: bold;
        }
        
        .error {
            color: var(--danger);
        }

        .terminal-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        
        .terminal-wrapper::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 3px;
        }
        
        .terminal-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        .terminal-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
                gap: 12px;
                height: auto;
                min-height: calc(100vh - 20px);
            }
            
            .header {
                padding: 5px 0;
            }
            
            .terminal-container {
                max-height: 50vh;
                min-height: 250px;
            }
            
            .terminal-wrapper {
                padding: 12px;
            }
            
            .input-group {
                flex-direction: column;
                gap: 8px;
            }
            
            .input {
                padding: 16px;
                font-size: 16px;
            }
            
            .btn {
                padding: 16px;
                width: 100%;
                min-width: auto;
            }
            
            .back-btn {
                padding: 16px;
            }
            
            .terminal {
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            
            .container {
                padding: 10px;
                border-radius: 8px;
            }
            
            .header h1 {
                font-size: 1.3rem;
            }
            
            .terminal-container {
                max-height: 45vh;
                min-height: 200px;
            }
            
            .input, .btn, .back-btn {
                padding: 14px;
            }
            
            .terminal {
                font-size: 13px;
            }
        }

        @supports (-webkit-touch-callout: none) {
            .input {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Serial Terminal</h1>
        </div>
        
        <div class="terminal-container">
            <div class="terminal-wrapper">
                <div class="terminal" id="terminal"></div>
            </div>
        </div>
        
        <div class="input-group">
            <input type="text" class="input" id="commandInput" placeholder="Type command..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            <button class="btn" id="sendButton">Send</button>
        </div>
        
        <button class="back-btn" onclick="location.href='/'">← Back to Main Menu</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('commandInput');
        const sendButton = document.getElementById('sendButton');
        const terminalWrapper = document.querySelector('.terminal-wrapper');
        
        let history = [];
        let historyIndex = -1;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        function preventContainerResize() {
            const container = document.querySelector('.container');
            container.style.height = isMobile ? 'auto' : '80vh';
            container.style.minHeight = isMobile ? 'calc(100vh - 20px)' : '80vh';
        }

        window.addEventListener('load', async () => {
            preventContainerResize();
            input.focus();

            if (isMobile) {
                setTimeout(() => {
                    input.blur();
                }, 100);
            }
            
            await sendAutoHelp();
        });
        
        window.addEventListener('resize', preventContainerResize);
        
        async function sendAutoHelp() {
            addCommand('help');
            
            try {
                const response = await fetch('/WebCommand', {
                    method: 'POST',
                    body: new URLSearchParams({ command: 'help' })
                });
                
                const text = await response.text();
                const lastOk = text.lastIndexOf('ok');
                const output = lastOk !== -1 ? text.substring(0, lastOk).trim() : text;
                
                addResponse(output);
                scrollToBottom();
            } catch (error) {
                addError('Network connection failed');
                scrollToBottom();
            }
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendCommand();
                if (isMobile) {
                    input.blur();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (history.length > 0) {
                    if (historyIndex === -1) {
                        historyIndex = history.length - 1;
                    } else if (historyIndex > 0) {
                        historyIndex--;
                    }
                    input.value = history[historyIndex] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    input.value = history[historyIndex] || '';
                } else {
                    historyIndex = -1;
                    input.value = '';
                }
            }
        });
        
        sendButton.addEventListener('click', sendCommand);

        if (isMobile) {
            terminalWrapper.addEventListener('click', () => {
                input.focus();
            });
        }
        
        function addCommand(command) {
            const div = document.createElement('div');
            div.className = 'terminal-line';
            div.innerHTML = `<span class="prompt">$</span> ${command}`;
            terminal.appendChild(div);
        }
        
        function addResponse(response) {
            const lines = response.split('\n');
            lines.forEach(line => {
                if (line.trim() !== '') {
                    const div = document.createElement('div');
                    div.className = 'terminal-line';
                    div.textContent = line;
                    terminal.appendChild(div);
                }
            });
        }
        
        function addError(error) {
            const div = document.createElement('div');
            div.className = 'terminal-line';
            div.innerHTML = `<span class="error">${error}</span>`;
            terminal.appendChild(div);
        }
        
        async function sendCommand() {
            const command = input.value.trim();
            if (!command) return;
            
            history.push(command);
            historyIndex = -1;
            
            addCommand(command);
            input.value = '';
            
            try {
                const response = await fetch('/WebCommand', {
                    method: 'POST',
                    body: new URLSearchParams({ command })
                });
                
                const text = await response.text();
                const lastOk = text.lastIndexOf('ok');
                const output = lastOk !== -1 ? text.substring(0, lastOk).trim() : text;
                
                addResponse(output);
                const emptyLine = document.createElement('div');
                emptyLine.className = 'terminal-line';
                emptyLine.style.height = '8px';
                terminal.appendChild(emptyLine);
            } catch (error) {
                addError('Network connection failed');
            }
            
            scrollToBottom();

            if (isMobile) {
                setTimeout(() => {
                    input.focus();
                }, 100);
            }
        }
        
        function scrollToBottom() {
            requestAnimationFrame(() => {
                terminalWrapper.scrollTop = terminalWrapper.scrollHeight;
            });
        }
    </script>
</body>
</html>
